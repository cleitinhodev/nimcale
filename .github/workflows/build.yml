name: Build (Windows + Linux)

on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      NIMCALE_CONFIG_DIR: ${{ github.workspace }}\ci_config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Download Mesa (software OpenGL fallback)
        run: python scripts/fetch_mesa.py

      - name: Build executable (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean nimcale.spec

      - name: Smoke tests of the frozen exe (GL probe, real start-up path, software renderer, selftest)
        shell: pwsh
        run: ./scripts/ci_smoke.ps1

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = (python -c "import nimcale; print(nimcale.__version__)").Trim()
          $zip = "Nimcale-$ver-windows-x64.zip"
          Compress-Archive -Path dist\Nimcale -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Get-Item $zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Nimcale-windows-x64
          path: ${{ steps.pkg.outputs.zip }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-screenshot
          path: ci_shot.png
          if-no-files-found: ignore

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = ".github/release-notes/$tag.md"
            $pre = if ($tag -match "-") { @("--prerelease", "--latest=false") } else { @() }
            if (Test-Path $notes) {
              $title = (Get-Content $notes -TotalCount 1).TrimStart("# ").Trim()
              gh release create $tag @pre --title "$title" --notes-file $notes
            } else {
              gh release create $tag @pre --title "Nimcale $tag" --generate-notes
            }
          }
          gh release upload $tag "${{ steps.pkg.outputs.zip }}" --clobber

  linux:
    # Ubuntu 22.04 (glibc 2.35): the binary also runs on newer distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NIMCALE_CONFIG_DIR: ${{ github.workspace }}/ci_config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System packages (virtual X server, Mesa OpenGL, GLFW runtime deps, AppImage tools)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libgl1 libegl1 libgl1-mesa-dri \
            libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6 libxkbcommon0 libxkbcommon-x11-0 \
            x11-utils desktop-file-utils file zsync

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: xvfb-run -a python -m pytest -q

      - name: Build executable (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean nimcale.spec

      - name: Package (tar.gz + AppImage)
        id: pkg
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p out
          APPIMAGETOOL="$PWD/appimagetool" PYTHON=python scripts/package_linux.sh dist/Nimcale out
          ls -la out
          echo "tar=$(ls out/*.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "appimage=$(ls out/*.AppImage)" >> "$GITHUB_OUTPUT"

      - name: Smoke tests of the packaged build under xvfb (probe, start-up, software GL, surface, selftest, AppImage)
        run: |
          mkdir -p smoke_pkg && tar -C smoke_pkg -xzf "${{ steps.pkg.outputs.tar }}"
          PYTHON=python scripts/ci_smoke_linux.sh smoke_pkg/Nimcale-*-linux-x86_64 "${{ steps.pkg.outputs.appimage }}" shots

      - uses: actions/upload-artifact@v4
        with:
          name: Nimcale-linux-x86_64
          path: |
            ${{ steps.pkg.outputs.tar }}
            ${{ steps.pkg.outputs.appimage }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-screenshot-linux
          path: shots/*.png
          if-no-files-found: ignore

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # the release is created by the Windows job (or by hand): wait for it, never create a second one
          for i in $(seq 1 40); do gh release view "$tag" > /dev/null 2>&1 && break; sleep 30; done
          gh release upload "$tag" "${{ steps.pkg.outputs.tar }}" "${{ steps.pkg.outputs.appimage }}" --clobber
