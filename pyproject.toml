[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimcale"
version = "1.0.0"
description = "Turn an image + height map into a 3D relief model (coins, medals, plates) and export watertight HD meshes."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "cleitinhodev" }]
requires-python = ">=3.10"
keywords = ["3d", "relief", "heightmap", "stl", "3d-printing", "coin", "imgui", "opengl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "imgui-bundle==1.93.0",
    "moderngl>=5.10,<6",
    "numpy>=1.24",
    "Pillow>=10.0",
    "scipy>=1.10",
    "fast-simplification>=0.1.7",
    "glfw>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "trimesh>=4", "networkx>=3", "lxml>=5", "pyinstaller>=6.10", "fonttools>=4.50"]

[project.urls]
Homepage = "https://www.bugzinho.com/"
Source = "https://github.com/cleitinhodev/nimcale"
Issues = "https://github.com/cleitinhodev/nimcale/issues"
Donate = "https://www.bugzinho.com/donate"

[project.gui-scripts]
nimcale = "nimcale.launcher:main"

[tool.setuptools.packages.find]
include = ["nimcale*"]

[tool.setuptools.package-data]
nimcale = ["assets/**/*", "i18n/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
