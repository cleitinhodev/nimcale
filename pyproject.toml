[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimcale"
version = "1.1.0b1"
description = "Turn an image + height map into a 3D relief model (coins, medals, plates) and export watertight HD meshes."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "cleitinhodev" }]
requires-python = ">=3.10"
keywords = ["3d", "relief", "heightmap", "stl", "3d-printing", "coin", "imgui", "opengl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "imgui-bundle==1.93.0",
    "moderngl==5.13.0",
    "glcontext==3.1.0",
    "numpy==2.5.4",
    "Pillow==13.0.0",
    "scipy==1.18.1",
    "fast-simplification==0.2.0",
    "glfw==2.11.0",
    "trimesh==5.2.0",
    "networkx==3.7",
    "lxml==6.1.3",
    "pycollada==0.9.3",
    "python-dateutil==4.0.0",
    "tzdata==2026.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10", "fonttools>=4.50"]

[project.urls]
Homepage = "https://www.bugzinho.com/"
Source = "https://github.com/cleitinhodev/nimcale"
Issues = "https://github.com/cleitinhodev/nimcale/issues"
Donate = "https://www.bugzinho.com/donate"

[project.gui-scripts]
nimcale = "nimcale.launcher:main"

[tool.setuptools.packages.find]
include = ["nimcale*"]

[tool.setuptools.package-data]
nimcale = ["assets/**/*", "i18n/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
